<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinedive – Movie</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="movie.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- BACK BUTTON -->
  <button class="mp-back-btn" id="mpBackBtn" aria-label="Go back">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <!-- POSTER / BACKDROP -->
  <div class="mp-hero" id="mpHero">
    <div class="mp-hero-gradient"></div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="mp-body">

    <!-- TITLE + META ROW -->
    <div class="mp-title-block">
      <h1 class="mp-title" id="mpTitle">—</h1>
      <div class="mp-meta-row" id="mpMetaRow"></div>
    </div>

    <!-- ACTION ROW -->
    <div class="mp-action-row">

      <button class="mp-trailer-btn" id="mpTrailerBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Watch Trailer
      </button>

      <button class="mp-icon-btn" id="mpWatchlistBtn" title="Add to Watchlist">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </button>

      <button class="mp-icon-btn" id="mpRateBtn" title="Like">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>

      <button class="mp-icon-btn" id="mpShareBtn" title="Share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </button>

    </div>

    <!-- SUMMARY -->
    <p class="mp-summary" id="mpSummary">—</p>

    <!-- DIVIDER -->
    <div class="mp-divider"></div>

    <!-- CAST -->
    <div class="mp-section">
      <div class="mp-section-label">Cast</div>
      <div class="mp-section-value" id="mpCast">—</div>
    </div>

    <!-- DIRECTOR -->
    <div class="mp-section">
      <div class="mp-section-label" id="mpDirectorLabel">Director</div>
      <div class="mp-section-value" id="mpDirector">—</div>
    </div>

    <!-- AVAILABLE ON -->
    <div class="mp-section">
      <div class="mp-section-label">Available On</div>
      <div class="mp-section-value" id="mpPlatforms">—</div>
    </div>

    <!-- LANGUAGES -->
    <div class="mp-section">
      <div class="mp-section-label">Languages</div>
      <div class="mp-section-value" id="mpLanguages">—</div>
    </div>

    <div class="mp-reserved-space"></div>

  </div>

  <!-- TRAILER MODAL -->
  <div class="mp-trailer-modal" id="mpTrailerModal">
    <div class="mp-trailer-backdrop" id="mpTrailerBackdrop"></div>
    <div class="mp-trailer-box">
      <button class="mp-trailer-close" id="mpTrailerClose" aria-label="Close trailer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="mp-trailer-frame-wrap" id="mpTrailerFrameWrap"></div>
    </div>
  </div>

  <script src="movie.js"></script>
</body>
</html>
